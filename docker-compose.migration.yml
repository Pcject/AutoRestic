services:
  autorestic:
    image: pcject/autorestic:latest
    container_name: autorestic-migration
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      AUTORESTIC_PORT: "8080"
      AUTORESTIC_DB_PATH: /app/data/autorestic.db
      AUTORESTIC_ENC_KEY_PATH: /app/data/autorestic.key
      AUTORESTIC_AUTH_TOKEN: ${AUTORESTIC_AUTH_TOKEN:?Set AUTORESTIC_AUTH_TOKEN before starting AutoRestic}
      AUTORESTIC_CORS_ORIGINS: ${AUTORESTIC_CORS_ORIGINS:-http://127.0.0.1:8083}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # AutoRestic application state. Preserve both autorestic.db and autorestic.key.
      - /absolute/path/to/autorestic-data:/app/data

      # Optional: reuse an existing restic cache during migration.
      - /absolute/path/to/restic-cache:/root/.cache/restic

      # Example source mounts. Configure these same container paths in the UI.
      - /absolute/path/to/source-a:/backup/source-a:ro
      - /absolute/path/to/source-b:/backup/source-b:ro
      - /absolute/path/to/repository:/restic-repository

      # Restore target. Create the host directory before running restores.
      - /absolute/path/to/restore-target:/restore
